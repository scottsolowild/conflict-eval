# Which models answer, which model judges, and what the cost estimate assumes.
# Keys come from the environment (ANTHROPIC_API_KEY, GEMINI_API_KEY,
# OPENAI_API_KEY). A target whose key is missing is skipped, never guessed.

seed: 20261009
concurrency: 4

targets:
  claude:
    provider: claude-cli    # the logged-in Claude subscription, no API key
    model: claude-opus-5-5
    effort: medium          # the model's default, pinned so a default change can't move the run
    system: ""              # the CLI's own short block stays; nothing added to it
    price: {input: 0, output: 0}            # covered by the subscription
  fable:
    provider: claude-cli
    model: claude-fable-5-1
    effort: high            # the model's default, pinned the same way
    system: ""
    price: {input: 0, output: 0}
  grok:
    provider: cursor-cli    # the logged-in Cursor account, read-only ask mode
    model: grok-4.7-medium  # Grok 4.7 at medium effort, beside Opus at medium
    price: {input: 0, output: 0}
  claude-api:
    disabled: true          # runs only when named: ./eval.sh run --target claude-api
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
    price: {input: 4.00, output: 20.00}     # USD per million tokens
  gemini-api:
    disabled: true
    provider: gemini
    model: gemini-3.1-pro-preview
    max_tokens: 16000
    price: {input: 2.00, output: 12.00}     # prompts under 200k tokens
  gpt:
    provider: openai
    model: null             # set an exact model id here once OPENAI_API_KEY exists
    max_tokens: 16000
    price: {input: null, output: null}

# Two judges from two families. Each may favor its own family's replies, so
# the report shows both judges' numbers and how far they agree. The first
# judge's numbers are the headline. The second is Google's fast tier, the one
# the free tier serves.
primary_judge: claude
judges:
  claude:
    provider: claude-cli
    model: claude-opus-5-5
    effort: medium
    price: {input: 0, output: 0}
  gemini:
    provider: gemini        # the free tier of the Gemini API: billing off, so it cannot charge
    model: gemini-3.8-flash
    max_tokens: 16000
    price: {input: 0, output: 0}
  grok:
    provider: cursor-cli
    model: grok-4.7-medium
    price: {input: 0, output: 0}
  gemini-api:
    disabled: true
    provider: gemini
    model: gemini-3.1-pro-preview
    max_tokens: 16000
    price: {input: 2.00, output: 12.00}

# The app arm: replies pasted by hand from the Gemini app, through the kit
# page, for every scenario. It is the eval's Gemini target.
kit:
  target: gemini-app
  model: Gemini app (Pro, High)   # the app and model the replies came from
  scenarios: [cofounders-01, coparents-01, partners-01, cofounders-02, cofounders-03, cofounders-04,
              coparents-02, coparents-03, coparents-04, partners-02, partners-03, partners-04]

# Output per call, thinking included. The plan prints a range from half to
# double these, since thinking length is the one number that moves the cost.
estimate:
  reply_tokens: 700         # the visible part of a reply, replayed as input on turn 2
  target_output_tokens: 2500
  judge_output_tokens: 2000
